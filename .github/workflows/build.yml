name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'Docs/**'
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'Docs/**'
      - '**.md'

env:
  EMSCRIPTEN_VERSION: 6.0.8
  NODE_VERSION: 24.x
  UBUNTU_CLANG_VERSION: 22
  UBUNTU_GCC_VERSION: 15
  VULKAN_VERSION: 1.4.363.1

jobs:
  linux-clang:
    runs-on: ubuntu-26.04
    name: Linux Clang
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]
            double_precision: [No, Yes]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-linux
      with:
        version: ${{env.VULKAN_VERSION}}
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        ./cmake_linux_clang_gcc.sh ${{matrix.build_type}} clang++-${{env.UBUNTU_CLANG_VERSION}} -DDOUBLE_PRECISION=${{matrix.double_precision}}
    - name: Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        cmake --build ${{github.workspace}}/Build/Linux_${{matrix.build_type}} -j $(nproc)
    - name: Test
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ctest --output-on-failure --verbose

  linux-clang-check-global-new:
    runs-on: ubuntu-26.04
    name: Linux Clang Check Global New

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-linux
      with:
        version: ${{env.VULKAN_VERSION}}
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        ./cmake_linux_clang_gcc.sh Debug clang++-${{env.UBUNTU_CLANG_VERSION}} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
    - name: Check Global New
      working-directory: ${{github.workspace}}/Build
      run: ./check_global_new.sh Linux_Debug clang-query-${{env.UBUNTU_CLANG_VERSION}}

  linux_clang_tsan:
    runs-on: ubuntu-26.04
    name: Linux Clang Sanitizers
    strategy:
        fail-fast: false
        matrix:
            build_type: [ReleaseASAN, ReleaseUBSAN, ReleaseTSAN]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-linux
      with:
        version: ${{env.VULKAN_VERSION}}
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        ./cmake_linux_clang_gcc.sh ${{matrix.build_type}} clang++-${{env.UBUNTU_CLANG_VERSION}} -DTARGET_VIEWER=OFF -DTARGET_SAMPLES=OFF -DTARGET_HELLO_WORLD=OFF -DTARGET_UNIT_TESTS=ON -DTARGET_PERFORMANCE_TEST=ON
    - name: Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        cmake --build ${{github.workspace}}/Build/Linux_${{matrix.build_type}} -j $(nproc)
    - name: Unit Tests
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ctest --output-on-failure --verbose
    - name: Test ConvexVsMesh
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ./PerformanceTest -q=LinearCast -t=max -s=ConvexVsMesh
    - name: Test Ragdoll
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ./PerformanceTest -q=LinearCast -t=max -s=Ragdoll

  linux-clang-so:
    runs-on: ubuntu-26.04
    name: Linux Clang Shared Library
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-linux
      with:
        version: ${{env.VULKAN_VERSION}}
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        ./cmake_linux_clang_gcc.sh ${{matrix.build_type}} clang++-${{env.UBUNTU_CLANG_VERSION}} -DBUILD_SHARED_LIBS=YES
    - name: Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        cmake --build ${{github.workspace}}/Build/Linux_${{matrix.build_type}} -j $(nproc)
    - name: Test
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ctest --output-on-failure --verbose

  linux-clang-32-bit:
    runs-on: ubuntu-26.04
    name: Linux Clang 32-bit
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Update APT
      run: sudo apt update
    - name: Install G++-Multilib
      run: sudo apt -y install g++-multilib
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_linux_clang_gcc.sh ${{matrix.build_type}} clang++-${{env.UBUNTU_CLANG_VERSION}} -DCMAKE_CXX_FLAGS=-m32 -DUSE_SSE4_1=OFF -DUSE_SSE4_2=OFF -DUSE_AVX=OFF -DUSE_AVX2=OFF -DUSE_AVX512=OFF -DUSE_LZCNT=OFF -DUSE_TZCNT=OFF -DUSE_F16C=OFF -DUSE_FMADD=OFF
    - name: Build
      run: cmake --build ${{github.workspace}}/Build/Linux_${{matrix.build_type}} -j $(nproc)
    - name: Test
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ctest --output-on-failure --verbose

  linux-gcc:
    runs-on: ubuntu-26.04
    name: Linux GCC
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-linux
      with:
        version: ${{env.VULKAN_VERSION}}
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        ./cmake_linux_clang_gcc.sh ${{matrix.build_type}} g++-${{env.UBUNTU_GCC_VERSION}}
    - name: Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        cmake --build ${{github.workspace}}/Build/Linux_${{matrix.build_type}} -j $(nproc)
    - name: Test
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ctest --output-on-failure --verbose

  linux-gcc-so:
    runs-on: ubuntu-26.04
    name: Linux GCC Shared Library
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-linux
      with:
        version: ${{env.VULKAN_VERSION}}
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        ./cmake_linux_clang_gcc.sh ${{matrix.build_type}} g++-${{env.UBUNTU_GCC_VERSION}} -DBUILD_SHARED_LIBS=Yes
    - name: Build
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        cmake --build ${{github.workspace}}/Build/Linux_${{matrix.build_type}} -j $(nproc)
    - name: Test
      working-directory: ${{github.workspace}}/Build/Linux_${{matrix.build_type}}
      run: ctest --output-on-failure --verbose

  msys2_mingw_gcc:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: msys2 {0}
    name: MSYS2 MinGW GCC
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release]
            shared_lib: [No, Yes]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64
        install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake
        update: true
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_linux_mingw.sh ${{matrix.build_type}} -DBUILD_SHARED_LIBS=${{matrix.shared_lib}}
    - name: Build
      run: cmake --build Build/MinGW_${{matrix.build_type}} -j $(nproc)
    - name: Test
      working-directory: Build/MinGW_${{matrix.build_type}}
      run: ctest --output-on-failure --verbose

  msvc_cl:
    runs-on: windows-2025-vs2026
    name: Visual Studio CL
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]
            double_precision: [No, Yes]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_vs2026_cl.bat -DDOUBLE_PRECISION=${{matrix.double_precision}}
    - name: Build
      run: msbuild Build\VS2026_CL\JoltPhysics.slnx /property:Configuration=${{matrix.build_type}} -m
    - name: Test
      working-directory: ${{github.workspace}}/Build/VS2026_CL/${{matrix.build_type}}
      run: ./UnitTests.exe

  msvc_cl_no_object_stream:
    runs-on: windows-2025-vs2026
    name: Visual Studio CL - No Object Stream
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Distribution]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_vs2026_cl.bat -DENABLE_OBJECT_STREAM=NO
    - name: Build
      run: msbuild Build\VS2026_CL\JoltPhysics.slnx /property:Configuration=${{matrix.build_type}} -m
    - name: Test
      working-directory: ${{github.workspace}}/Build/VS2026_CL/${{matrix.build_type}}
      run: ./UnitTests.exe

  msvc_cl_dll:
    runs-on: windows-2025-vs2026
    name: Visual Studio CL Shared Library
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_vs2026_cl.bat -DBUILD_SHARED_LIBS=Yes
    - name: Build
      run: msbuild Build\VS2026_CL\JoltPhysics.slnx /property:Configuration=${{matrix.build_type}} -m
    - name: Test
      working-directory: ${{github.workspace}}/Build/VS2026_CL/${{matrix.build_type}}
      run: ./UnitTests.exe

  msvc_cl_32_bit:
    runs-on: windows-2025-vs2026
    name: Visual Studio CL 32-bit
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_vs2026_cl_32bit.bat
    - name: Build
      run: msbuild Build\VS2026_CL_32BIT\JoltPhysics.slnx /property:Configuration=${{matrix.build_type}} -m
    - name: Test
      working-directory: ${{github.workspace}}/Build/VS2026_CL_32BIT/${{matrix.build_type}}
      run: ./UnitTests.exe

  msvc_cl_arm:
    runs-on: windows-2025-vs2026
    name: Visual Studio CL ARM
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_vs2026_cl_arm.bat
    - name: Build
      run: msbuild Build\VS2026_CL_ARM\JoltPhysics.slnx /property:Configuration=${{matrix.build_type}} -m

  msvc_clang:
    runs-on: windows-2025-vs2026
    name: Visual Studio Clang
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]
            double_precision: [No, Yes]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_vs2026_clang.bat -DDOUBLE_PRECISION=${{matrix.double_precision}}
    - name: Build
      run: msbuild Build\VS2026_Clang\JoltPhysics.slnx /property:Configuration=${{matrix.build_type}} -m
    - name: Test
      working-directory: ${{github.workspace}}/Build/VS2026_Clang/${{matrix.build_type}}
      run: ./UnitTests.exe

  macos:
    runs-on: macos-latest
    name: macOS
    env:
        VULKAN_SDK_INSTALL: ${{github.workspace}}/vulkan_sdk
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release, Distribution]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Install Metal Toolchain
      run: xcodebuild -downloadComponent MetalToolchain
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-macos
      with:
        version: ${{env.VULKAN_VERSION}}
        path: ${{env.VULKAN_SDK_INSTALL}}
    - name: Configure CMake
      run: |
        source ${VULKAN_SDK_INSTALL}/setup-env.sh
        cmake -B ${{github.workspace}}/Build/MacOS_${{matrix.build_type}} -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_COMPILER=clang++ Build
    - name: Build
      run: cmake --build ${{github.workspace}}/Build/MacOS_${{matrix.build_type}} -j $(sysctl -n hw.ncpu)
    - name: Test
      working-directory: ${{github.workspace}}/Build/MacOS_${{matrix.build_type}}
      run: |
        source ${VULKAN_SDK_INSTALL}/setup-env.sh
        ctest --output-on-failure --verbose

  android:
    runs-on: ubuntu-26.04
    name: Android (${{matrix.build_type}})
    env:
        ANDROID_API_LEVEL: 34
        ANDROID_ARCH: x86_64
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-linux
      with:
        version: ${{env.VULKAN_VERSION}}
    - name: Gradle Build
      working-directory: ${{github.workspace}}/Build/Android
      run: |
        source $HOME/vulkan/${{env.VULKAN_VERSION}}/setup-env.sh
        ./gradlew assemble${{matrix.build_type}} --no-daemon
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install Emulator
      id: emulator
      run: |
        # Make the SDK location available to the cache steps below
        echo "ANDROID_SDK_DIR=$ANDROID_HOME" >> $GITHUB_ENV
        # Install the latest emulator (the same as android-emulator-runner does) so that we can include its version in the cache key.
        # A snapshot made by an older emulator version can't be loaded, so we need to regenerate it.
        # sdkmanager is not in the PATH, prefer cmdline-tools/latest but fall back to any other installed version
        SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2> /dev/null | head -n 1)
        "$SDKMANAGER" --install emulator --channel=0 > /dev/null
        echo "version=$(grep Pkg.Revision $ANDROID_HOME/emulator/source.properties | cut -d= -f2)" >> $GITHUB_OUTPUT
    - name: Restore Emulator
      id: emulator-cache
      uses: actions/cache/restore@v6
      with:
        # The system image and the AVD including a snapshot of the booted emulator
        path: |
          ${{env.ANDROID_SDK_DIR}}/system-images/android-${{env.ANDROID_API_LEVEL}}
          ~/.android/avd/*
          ~/.android/adb*
        key: android-emulator-${{env.ANDROID_API_LEVEL}}-${{env.ANDROID_ARCH}}-${{steps.emulator.outputs.version}}
    - name: Create Emulator Snapshot
      if: steps.emulator-cache.outputs.cache-hit != 'true'
      timeout-minutes: 30
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{env.ANDROID_API_LEVEL}}
        arch: ${{env.ANDROID_ARCH}}
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "Generated AVD snapshot for caching"
    - name: Save Emulator
      # Save the cache right after creating the snapshot, if we save it at the end of the job the disk image of the AVD will contain the installed unit tests
      if: steps.emulator-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{env.ANDROID_SDK_DIR}}/system-images/android-${{env.ANDROID_API_LEVEL}}
          ~/.android/avd/*
          ~/.android/adb*
        key: ${{steps.emulator-cache.outputs.cache-primary-key}}
    - name: Run Unit Tests
      timeout-minutes: 30
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{env.ANDROID_API_LEVEL}}
        arch: ${{env.ANDROID_ARCH}}
        force-avd-creation: false
        # Boot from the cached snapshot, but don't write the state after running the tests back to it
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash ${{github.workspace}}/Build/Android/run_unit_tests.sh ${{github.workspace}}/Build/Android/UnitTests/build 600 ${{matrix.build_type}}

  ios:
    runs-on: macos-latest
    name: iOS (${{matrix.build_type}})
    env:
        VULKAN_SDK_INSTALL: ${{github.workspace}}/vulkan_sdk
    strategy:
        fail-fast: false
        matrix:
            build_type: [Debug, Release]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Boot Simulator
      run: |
        # Create an iPhone simulator using the newest available iOS runtime
        read RUNTIME DEVICE_TYPE < <(xcrun simctl list runtimes ios available -j | python3 -c "
        import json, sys
        r = json.load(sys.stdin)['runtimes'][-1]
        print(r['identifier'], [d['identifier'] for d in r['supportedDeviceTypes'] if d['productFamily'] == 'iPhone'][-1])")
        echo "Using $DEVICE_TYPE with $RUNTIME"
        UDID=$(xcrun simctl create JoltUnitTests $DEVICE_TYPE $RUNTIME)
        echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
        # Boot in the background so that booting overlaps with the build, the 'Wait for Simulator' step waits for it to finish
        nohup xcrun simctl boot $UDID > /dev/null 2>&1 &
    - name: Install Metal Toolchain
      run: xcodebuild -downloadComponent MetalToolchain
    - name: Install Vulkan
      uses: ./.github/actions/install-vulkan-macos
      with:
        version: ${{env.VULKAN_VERSION}}
        path: ${{env.VULKAN_SDK_INSTALL}}
    - name: Configure CMake
      run: |
        source ${VULKAN_SDK_INSTALL}/setup-env.sh
        cmake -B ${{github.workspace}}/Build/XCode_iOS -DTARGET_HELLO_WORLD=OFF -DTARGET_PERFORMANCE_TEST=OFF -DCMAKE_SYSTEM_NAME=iOS -GXcode Build
    - name: Build
      run: cmake --build ${{github.workspace}}/Build/XCode_iOS --config ${{matrix.build_type}} -- -sdk iphonesimulator -arch arm64 -j $(sysctl -n hw.ncpu)
    - name: Wait for Simulator
      run: xcrun simctl bootstatus $SIMULATOR_UDID -b
    - name: Test
      working-directory: ${{github.workspace}}/Build/XCode_iOS
      run: |
        xcrun simctl install $SIMULATOR_UDID ${{matrix.build_type}}-iphonesimulator/UnitTests.app
        # simctl launch does not forward the exit code of the app, so check the doctest output instead
        xcrun simctl launch --console-pty --terminate-running-process $SIMULATOR_UDID com.joltphysics.unittests --no-colors 2>&1 | tee UnitTests.log
        grep -q "Status: SUCCESS!" UnitTests.log

  emscripten:
    runs-on: ubuntu-26.04
    name: Emscripten

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: ${{env.EMSCRIPTEN_VERSION}}
    - name: Verify emsdk
      run: emcc -v
    - name: Setup Node.js ${{env.NODE_VERSION}}
      uses: actions/setup-node@v7
      with:
        node-version: ${{env.NODE_VERSION}}
    - name: Configure CMake
      working-directory: ${{github.workspace}}/Build
      run: ./cmake_linux_emscripten.sh Distribution -DTARGET_HELLO_WORLD=OFF -DTARGET_PERFORMANCE_TEST=OFF
    - name: Build
      run: cmake --build ${{github.workspace}}/Build/WASM_Distribution -j $(nproc)
    - name: Test
      working-directory: ${{github.workspace}}/Build/WASM_Distribution
      run: node UnitTests.js
